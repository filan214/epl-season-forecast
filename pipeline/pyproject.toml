[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eplforecast"
version = "0.1.0"
description = "Bayesian season-long forecasting pipeline for the 2026-27 English Premier League."
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["bayesian", "pymc", "football", "forecasting", "premier-league"]

# Dependencies mirror IMPLEMENTATION_GUIDE.md §1. No ORM on the Python side:
# the pipeline writes through raw parameterised SQL against tables Drizzle owns.
dependencies = [
  # Core modelling
  "pymc>=5",
  "arviz>=0.18",
  "pytensor>=2.18",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyarrow>=15",
  # Ingest
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "understatapi",              # xG scrape (ScraperFC is the documented alternative)
  # Database (plain SQL writes, no ORM)
  "psycopg[binary]>=3.1",
  # Config / secrets
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
eplforecast = "eplforecast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eplforecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]  # import eplforecast without an editable install
